spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order}
    username: ${ORDER_DB_USER:mercatus}
    password: ${ORDER_DB_PASSWORD:mercatus}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

server:
  servlet:
    context-path: /api/v1

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

order:
  saga:
    reserve-timeout: ${ORDER_RESERVE_TIMEOUT:PT5M}
  messaging:
    topics:
      commands: ${INVENTORY_COMMANDS_TOPIC:inventory.commands.v1}
      events: ${INVENTORY_EVENTS_TOPIC:inventory.events.v1}
    outbox:
      poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
      batch-size: ${OUTBOX_BATCH_SIZE:100}
      send-timeout: ${OUTBOX_SEND_TIMEOUT:10s}
  clients:
    catalog:
      base-url: ${CATALOG_BASE_URL:http://localhost:8081/api/v1}
      connect-timeout: ${CATALOG_CONNECT_TIMEOUT:2s}
      read-timeout: ${CATALOG_READ_TIMEOUT:5s}
    customer:
      base-url: ${CUSTOMER_BASE_URL:http://localhost:8082/api/v1}
      connect-timeout: ${CUSTOMER_CONNECT_TIMEOUT:2s}
      read-timeout: ${CUSTOMER_READ_TIMEOUT:5s}
